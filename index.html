<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Music Bubble POC V0.6.2</title>

<style>
body{
    margin:0;
    padding:24px;
    background:#101014;
    color:white;
    font-family:Arial,sans-serif;
}

h1{
    margin-top:0;
}

.box{
    padding:16px;
    background:#1d1d24;
    border-radius:12px;
    margin-bottom:14px;
}

.value{
    font-weight:bold;
}

#status{
    opacity:.85;
}

.state-playing{
    color:#8fff9b;
}

.state-loading{
    color:#86caff;
}

.state-ended{
    color:#ffca6a;
}

.state-none{
    color:#bcbcbc;
}

#audioUnlockBox{
    text-align:center;
}

#audioUnlockButton{
    padding:14px 22px;
    font-size:16px;
    font-weight:bold;
    border:0;
    border-radius:10px;
    cursor:pointer;
}

#audioUnlockMessage{
    margin-top:10px;
    opacity:.75;
    font-size:13px;
}
</style>
</head>

<body>

<h1>Music Bubble</h1>

<div class="box">

    <div>
        POC V0.6.2 — Web Audio Engine
    </div>

    <div id="status">
        Initialisation...
    </div>

</div>


<div
    class="box"
    id="audioUnlockBox"
>

    <button id="audioUnlockButton">
        🔊 Enable Audio
    </button>

    <div id="audioUnlockMessage">
        Un seul clic pour activer le moteur audio Music Bubble.
    </div>

</div>


<div class="box">

    <div>
        État:
        <span
            class="value state-none"
            id="playState"
        >
            NO TRACK
        </span>
    </div>

    <div>
        Broadcaster:
        <span
            class="value"
            id="broadcaster"
        >
            NONE
        </span>
    </div>

    <div>
        Track:
        <span
            class="value"
            id="track"
        >
            NONE
        </span>
    </div>

    <div>
        Zone:
        <span
            class="value"
            id="zone"
        >
            NONE
        </span>
    </div>

    <div>
        Distance:
        <span
            class="value"
            id="distance"
        >
            --
        </span>
        m
    </div>

    <div>
        Volume:
        <span
            class="value"
            id="volume"
        >
            0
        </span>
        %
    </div>

    <div>
        Position:
        <span
            class="value"
            id="position"
        >
            --
        </span>
    </div>

</div>


<script>

const PROXY =
    "https://music-bubble-proxy.christelle-gourvest.workers.dev";


const params =
    new URLSearchParams(
        window.location.search
    );


const receiver =
    params.get(
        "receiver"
    );



const statusEl =
    document.getElementById(
        "status"
    );


const stateEl =
    document.getElementById(
        "playState"
    );


const broadcasterEl =
    document.getElementById(
        "broadcaster"
    );


const trackEl =
    document.getElementById(
        "track"
    );


const zoneEl =
    document.getElementById(
        "zone"
    );


const distanceEl =
    document.getElementById(
        "distance"
    );


const volumeEl =
    document.getElementById(
        "volume"
    );


const positionEl =
    document.getElementById(
        "position"
    );


const audioUnlockButton =
    document.getElementById(
        "audioUnlockButton"
    );


const audioUnlockMessage =
    document.getElementById(
        "audioUnlockMessage"
    );



let audioContext = null;

let gainNode = null;

let currentSource = null;

let currentBuffer = null;

let currentSessionId = "";

let currentTrackUrl = "";

let sourceStartContextTime = 0;

let sourceStartOffset = 0;

let audioUnlocked = false;

let lastData = null;

let lastGoodUpdate = 0;

let lastSyncAt = 0;

let loadGeneration = 0;


// Cache des morceaux déjà téléchargés.
const bufferCache =
    new Map();



function clamp(
    value,
    min,
    max
)
{
    return Math.min(
        Math.max(
            value,
            min
        ),
        max
    );
}



function formatTime(
    seconds
)
{
    if (
        !Number.isFinite(
            seconds
        )
    )
    {
        return "--";
    }


    seconds =
        Math.max(
            0,
            Math.floor(
                seconds
            )
        );


    const minutes =
        Math.floor(
            seconds / 60
        );


    const remaining =
        seconds % 60;


    return (
        minutes
        +
        ":"
        +
        String(
            remaining
        ).padStart(
            2,
            "0"
        )
    );
}



function expectedPosition(
    data
)
{
    const serverUnix =
        Number(
            data.serverUnix
        )
        ||
        0;


    const startedAt =
        Number(
            data.startedAt
        )
        ||
        0;


    if (
        serverUnix <= 0
        ||
        startedAt <= 0
    )
    {
        return 0;
    }


    return Math.max(
        0,
        serverUnix - startedAt
    );
}



function setDisplayState(
    state
)
{
    stateEl.textContent =
        state;


    stateEl.classList.remove(
        "state-playing",
        "state-loading",
        "state-ended",
        "state-none"
    );


    if (
        state === "PLAYING"
    )
    {
        stateEl.classList.add(
            "state-playing"
        );
    }

    else if (
        state === "LOADING"
    )
    {
        stateEl.classList.add(
            "state-loading"
        );
    }

    else if (
        state === "ENDED"
    )
    {
        stateEl.classList.add(
            "state-ended"
        );
    }

    else
    {
        stateEl.classList.add(
            "state-none"
        );
    }
}



function stopCurrentSource()
{
    if (
        currentSource
    )
    {
        try
        {
            currentSource.stop();
        }

        catch (
            error
        )
        {
        }


        try
        {
            currentSource.disconnect();
        }

        catch (
            error
        )
        {
        }


        currentSource =
            null;
    }
}



function getLocalPlaybackPosition()
{
    if (
        !audioContext
        ||
        !currentSource
    )
    {
        return sourceStartOffset;
    }


    return (
        sourceStartOffset
        +
        (
            audioContext.currentTime
            -
            sourceStartContextTime
        )
    );
}



async function getAudioBuffer(
    url
)
{
    if (
        bufferCache.has(
            url
        )
    )
    {
        return bufferCache.get(
            url
        );
    }


    const response =
        await fetch(
            url,
            {
                cache:
                    "force-cache"
            }
        );


    if (
        !response.ok
    )
    {
        throw new Error(
            "Audio HTTP "
            +
            response.status
        );
    }


    const arrayBuffer =
        await response.arrayBuffer();


    const decoded =
        await audioContext.decodeAudioData(
            arrayBuffer
        );


    bufferCache.set(
        url,
        decoded
    );


    return decoded;
}



function startBufferAt(
    buffer,
    position
)
{
    stopCurrentSource();


    if (
        !audioContext
        ||
        audioContext.state !== "running"
    )
    {
        return;
    }


    if (
        position >= buffer.duration
    )
    {
        sourceStartOffset =
            buffer.duration;


        setDisplayState(
            "ENDED"
        );


        statusEl.textContent =
            "Session terminée";


        return;
    }


    position =
        clamp(
            position,
            0,
            buffer.duration
        );


    const source =
        audioContext.createBufferSource();


    source.buffer =
        buffer;


    source.connect(
        gainNode
    );


    currentSource =
        source;


    sourceStartOffset =
        position;


    sourceStartContextTime =
        audioContext.currentTime;


    source.start(
        0,
        position
    );


    setDisplayState(
        "PLAYING"
    );


    statusEl.textContent =
        "Receiver connecté — session synchronisée";


    source.onended =
        () =>
        {
            if (
                currentSource === source
            )
            {
                currentSource =
                    null;


                setDisplayState(
                    "ENDED"
                );


                statusEl.textContent =
                    "Session terminée";
            }
        };
}



async function loadSession(
    data
)
{
    const sessionId =
        data.sessionId
        ||
        "";


    const trackUrl =
        data.trackUrl
        ||
        "";


    if (
        !sessionId
        ||
        !trackUrl
    )
    {
        stopCurrentSource();


        currentSessionId =
            "";


        currentTrackUrl =
            "";


        currentBuffer =
            null;


        setDisplayState(
            "NO TRACK"
        );


        return;
    }


    currentSessionId =
        sessionId;


    currentTrackUrl =
        trackUrl;


    const myGeneration =
        ++loadGeneration;


    stopCurrentSource();


    setDisplayState(
        "LOADING"
    );


    statusEl.textContent =
        "Chargement du morceau...";


    try
    {
        const buffer =
            await getAudioBuffer(
                trackUrl
            );


        if (
            myGeneration !==
            loadGeneration
        )
        {
            return;
        }


        if (
            !lastData
            ||
            lastData.sessionId
            !==
            sessionId
        )
        {
            return;
        }


        currentBuffer =
            buffer;


        const position =
            expectedPosition(
                lastData
            );


        positionEl.textContent =
            formatTime(
                Math.min(
                    position,
                    buffer.duration
                )
            )
            +
            " / "
            +
            formatTime(
                buffer.duration
            );


        if (
            audioUnlocked
        )
        {
            startBufferAt(
                buffer,
                position
            );
        }

        else
        {
            statusEl.textContent =
                "Clique une fois sur Enable Audio.";
        }
    }

    catch (
        error
    )
    {
        console.error(
            error
        );


        setDisplayState(
            "NO TRACK"
        );


        statusEl.textContent =
            "Erreur de chargement audio";
    }
}



async function unlockAudio()
{
    try
    {
        if (
            !audioContext
        )
        {
            const AudioContextClass =
                window.AudioContext
                ||
                window.webkitAudioContext;


            audioContext =
                new AudioContextClass();


            gainNode =
                audioContext.createGain();


            gainNode.gain.value =
                0;


            gainNode.connect(
                audioContext.destination
            );


            // Petit buffer silencieux utilisé uniquement
            // pour amorcer le moteur audio dans le geste utilisateur.
            const silentBuffer =
                audioContext.createBuffer(
                    1,
                    1,
                    audioContext.sampleRate
                );


            const silentSource =
                audioContext.createBufferSource();


            silentSource.buffer =
                silentBuffer;


            silentSource.connect(
                gainNode
            );


            silentSource.start();
        }


        await audioContext.resume();


        if (
            audioContext.state ===
            "running"
        )
        {
            audioUnlocked =
                true;


            audioUnlockButton.textContent =
                "🔊 Audio Enabled";


            audioUnlockMessage.textContent =
                "Moteur audio activé. Les prochains changements doivent être automatiques.";


            if (
                lastData
            )
            {
                const volume =
                    clamp(
                        Number(
                            lastData.volume
                        )
                        ||
                        0,

                        0,
                        1
                    );


                gainNode.gain.setValueAtTime(
                    volume,
                    audioContext.currentTime
                );


                if (
                    currentBuffer
                )
                {
                    startBufferAt(
                        currentBuffer,
                        expectedPosition(
                            lastData
                        )
                    );
                }

                else if (
                    lastData.sessionId
                    &&
                    lastData.trackUrl
                )
                {
                    loadSession(
                        lastData
                    );
                }
            }
        }

        else
        {
            statusEl.textContent =
                "Le viewer n'a pas autorisé Web Audio.";
        }
    }

    catch (
        error
    )
    {
        console.error(
            error
        );


        statusEl.textContent =
            "Impossible d'activer Web Audio.";
    }
}



audioUnlockButton.addEventListener(
    "click",
    unlockAudio
);



function updateDisplay(
    data
)
{
    broadcasterEl.textContent =
        data.broadcasterName

        ?

        decodeURIComponent(
            data.broadcasterName
        )

        :

        "NONE";


    trackEl.textContent =
        data.trackTitle

        ?

        decodeURIComponent(
            data.trackTitle
        )

        :

        "NONE";


    zoneEl.textContent =
        data.zone
        ||
        "NONE";


    distanceEl.textContent =

        Number(
            data.distance
        )
        >=
        0

        ?

        Number(
            data.distance
        ).toFixed(
            2
        )

        :

        "--";


    const volume =
        clamp(
            Number(
                data.volume
            )
            ||
            0,

            0,
            1
        );


    volumeEl.textContent =
        Math.round(
            volume
            *
            100
        );


    if (
        audioContext
        &&
        gainNode
    )
    {
        gainNode.gain.setTargetAtTime(
            volume,
            audioContext.currentTime,
            0.05
        );
    }


    const position =
        expectedPosition(
            data
        );


    if (
        currentBuffer
    )
    {
        positionEl.textContent =
            formatTime(
                Math.min(
                    position,
                    currentBuffer.duration
                )
            )
            +
            " / "
            +
            formatTime(
                currentBuffer.duration
            );
    }

    else
    {
        positionEl.textContent =
            formatTime(
                position
            );
    }
}



function checkSynchronization(
    data
)
{
    if (
        !audioUnlocked
        ||
        !audioContext
        ||
        !currentBuffer
        ||
        !currentSource
    )
    {
        return;
    }


    if (
        Date.now()
        -
        lastSyncAt
        <
        2000
    )
    {
        return;
    }


    lastSyncAt =
        Date.now();


    const expected =
        expectedPosition(
            data
        );


    const local =
        getLocalPlaybackPosition();


    const drift =
        Math.abs(
            expected
            -
            local
        );


    if (
        drift > 2
        &&
        expected <
        currentBuffer.duration
    )
    {
        startBufferAt(
            currentBuffer,
            expected
        );
    }
}



function applyState(
    data
)
{
    lastData =
        data;


    updateDisplay(
        data
    );


    const sessionId =
        data.sessionId
        ||
        "";


    const trackUrl =
        data.trackUrl
        ||
        "";


    if (
        !sessionId
        ||
        !trackUrl
    )
    {
        if (
            currentSessionId
            !==
            ""
        )
        {
            loadGeneration++;


            stopCurrentSource();


            currentBuffer =
                null;


            currentSessionId =
                "";


            currentTrackUrl =
                "";
        }


        setDisplayState(
            "NO TRACK"
        );


        lastGoodUpdate =
            Date.now();


        return;
    }


    if (
        sessionId
        !==
        currentSessionId
        ||
        trackUrl
        !==
        currentTrackUrl
    )
    {
        loadSession(
            data
        );
    }

    else
    {
        checkSynchronization(
            data
        );
    }


    lastGoodUpdate =
        Date.now();
}



async function refreshState()
{
    if (
        !receiver
    )
    {
        statusEl.textContent =
            "Aucune URL Receiver reçue.";


        return;
    }


    const target =
        PROXY
        +
        "/volume?target="
        +
        encodeURIComponent(
            receiver
        );


    try
    {
        const response =
            await fetch(
                target,
                {
                    cache:
                        "no-store"
                }
            );


        if (
            !response.ok
        )
        {
            throw new Error(
                "HTTP "
                +
                response.status
            );
        }


        const text =
            await response.text();


        const data =
            JSON.parse(
                text
            );


        applyState(
            data
        );
    }


    catch (
        error
    )
    {
        console.error(
            error
        );


        statusEl.textContent =
            "Receiver inaccessible";


        if (
            Date.now()
            -
            lastGoodUpdate
            >
            2000
        )
        {
            if (
                gainNode
                &&
                audioContext
            )
            {
                gainNode.gain.setTargetAtTime(
                    0,
                    audioContext.currentTime,
                    0.05
                );
            }


            volumeEl.textContent =
                "0";
        }
    }
}



setInterval(
    refreshState,
    500
);


refreshState();

</script>

</body>
</html>
