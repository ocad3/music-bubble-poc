<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Music Bubble POC V0.6.1</title>

<style>
body{
    margin:0;
    padding:24px;
    background:#101014;
    color:white;
    font-family:Arial,sans-serif;
}

h1{
    margin-top:0;
}

.box{
    padding:16px;
    background:#1d1d24;
    border-radius:12px;
    margin-bottom:14px;
}

audio{
    width:100%;
}

.value{
    font-weight:bold;
}

#status{
    opacity:.85;
}

.state-playing{
    color:#8fff9b;
}

.state-ended{
    color:#ffca6a;
}

.state-none{
    color:#bcbcbc;
}

#audioUnlockBox{
    text-align:center;
}

#audioUnlockButton{
    padding:14px 22px;
    font-size:16px;
    font-weight:bold;
    border:0;
    border-radius:10px;
    cursor:pointer;
}

#audioUnlockMessage{
    margin-top:10px;
    opacity:.75;
    font-size:13px;
}
</style>
</head>

<body>

<h1>Music Bubble</h1>

<div class="box">
    <div>POC V0.6.1 — Generic Bubble + Audio Unlock</div>
    <div id="status">Initialisation...</div>
</div>


<div
    class="box"
    id="audioUnlockBox"
>
    <button id="audioUnlockButton">
        🔊 Enable Audio
    </button>

    <div id="audioUnlockMessage">
        Un seul clic pour autoriser la lecture automatique des Music Bubbles.
    </div>
</div>


<div class="box">

    <div>
        État:
        <span
            class="value state-none"
            id="playState"
        >
            NO TRACK
        </span>
    </div>

    <div>
        Broadcaster:
        <span
            class="value"
            id="broadcaster"
        >
            NONE
        </span>
    </div>

    <div>
        Track:
        <span
            class="value"
            id="track"
        >
            NONE
        </span>
    </div>

    <div>
        Zone:
        <span
            class="value"
            id="zone"
        >
            NONE
        </span>
    </div>

    <div>
        Distance:
        <span
            class="value"
            id="distance"
        >
            --
        </span>
        m
    </div>

    <div>
        Volume:
        <span
            class="value"
            id="volume"
        >
            0
        </span>
        %
    </div>

    <div>
        Position cible:
        <span
            class="value"
            id="position"
        >
            --
        </span>
    </div>

</div>


<div class="box">

    <audio
        id="player"
        controls
        preload="auto">
    </audio>

</div>


<script>

const PROXY =
    "https://music-bubble-proxy.christelle-gourvest.workers.dev";


const params =
    new URLSearchParams(
        window.location.search
    );


const receiver =
    params.get("receiver");


const player =
    document.getElementById(
        "player"
    );


const statusEl =
    document.getElementById(
        "status"
    );


const stateEl =
    document.getElementById(
        "playState"
    );


const broadcasterEl =
    document.getElementById(
        "broadcaster"
    );


const trackEl =
    document.getElementById(
        "track"
    );


const zoneEl =
    document.getElementById(
        "zone"
    );


const distanceEl =
    document.getElementById(
        "distance"
    );


const volumeEl =
    document.getElementById(
        "volume"
    );


const positionEl =
    document.getElementById(
        "position"
    );


const audioUnlockBox =
    document.getElementById(
        "audioUnlockBox"
    );


const audioUnlockButton =
    document.getElementById(
        "audioUnlockButton"
    );


const audioUnlockMessage =
    document.getElementById(
        "audioUnlockMessage"
    );



let currentSessionId = "";

let pendingSeek = null;

let lastGoodUpdate = 0;

let lastSyncAt = 0;

let lastData = null;


// IMPORTANT:
//
// FALSE = le navigateur intégré n'a pas encore
// reçu d'interaction utilisateur.
//
// TRUE = l'utilisateur a cliqué Enable Audio.
//
let audioUnlocked = false;



function clamp(
    value,
    min,
    max
)
{
    return Math.min(
        Math.max(
            value,
            min
        ),
        max
    );
}



function formatTime(
    seconds
)
{
    seconds =
        Math.max(
            0,
            Math.floor(
                seconds
            )
        );


    const minutes =
        Math.floor(
            seconds / 60
        );


    const remaining =
        seconds % 60;


    return (
        minutes
        +
        ":"
        +
        String(
            remaining
        ).padStart(
            2,
            "0"
        )
    );
}



function expectedPosition(
    data
)
{
    const serverUnix =
        Number(
            data.serverUnix
        )
        ||
        0;


    const startedAt =
        Number(
            data.startedAt
        )
        ||
        0;


    if (
        serverUnix <= 0
        ||
        startedAt <= 0
    )
    {
        return 0;
    }


    return Math.max(
        0,
        serverUnix - startedAt
    );
}



function setDisplayState(
    state
)
{
    stateEl.textContent =
        state;


    stateEl.classList.remove(
        "state-playing",
        "state-ended",
        "state-none"
    );


    if (
        state === "PLAYING"
    )
    {
        stateEl.classList.add(
            "state-playing"
        );
    }

    else if (
        state === "ENDED"
    )
    {
        stateEl.classList.add(
            "state-ended"
        );
    }

    else
    {
        stateEl.classList.add(
            "state-none"
        );
    }
}



function updatePassiveDisplay(
    data
)
{
    const sessionId =
        data.sessionId
        ||
        "";


    const trackUrl =
        data.trackUrl
        ||
        "";


    if (
        !sessionId
        ||
        !trackUrl
    )
    {
        setDisplayState(
            "NO TRACK"
        );

        return;
    }


    const expected =
        expectedPosition(
            data
        );


    if (
        sessionId === currentSessionId
        &&
        Number.isFinite(
            player.duration
        )
        &&
        player.duration > 0
    )
    {
        positionEl.textContent =
            formatTime(
                Math.min(
                    expected,
                    player.duration
                )
            )
            +
            " / "
            +
            formatTime(
                player.duration
            );


        if (
            expected >= player.duration
        )
        {
            setDisplayState(
                "ENDED"
            );
        }

        else
        {
            setDisplayState(
                "PLAYING"
            );
        }


        return;
    }


    setDisplayState(
        "PLAYING"
    );
}



function markAudioUnlocked()
{
    audioUnlocked =
        true;


    audioUnlockButton.textContent =
        "🔊 Audio Enabled";


    audioUnlockMessage.textContent =
        "Audio déverrouillé — les changements de Music Bubble peuvent maintenant se lancer automatiquement.";
}



function hideAudioUnlock()
{
    audioUnlockBox.style.display =
        "none";
}



async function unlockAudio()
{
    markAudioUnlocked();


    // Si une musique est déjà chargée,
    // le clic utilisateur lance directement celle-ci.
    if (
        player.src
        &&
        player.src !== ""
    )
    {
        try
        {
            await player.play();


            statusEl.textContent =
                "Audio activé — session synchronisée";


            hideAudioUnlock();
        }

        catch (
            error
        )
        {
            audioUnlockMessage.textContent =
                "Audio autorisé. Si nécessaire, reclique une fois lorsque tu es dans une Music Bubble.";
        }
    }

    else
    {
        audioUnlockMessage.textContent =
            "Audio prêt. Approche-toi d'une Music Bubble pour charger une musique.";
    }
}



audioUnlockButton.addEventListener(
    "click",
    unlockAudio
);



function seekAndPlay(
    position
)
{
    if (
        !Number.isFinite(
            player.duration
        )
        ||
        player.duration <= 0
    )
    {
        pendingSeek =
            position;

        return;
    }


    if (
        position
        >=
        player.duration
    )
    {
        player.currentTime =
            Math.max(
                0,
                player.duration
                -
                0.05
            );


        player.pause();


        statusEl.textContent =
            "Session terminée";


        return;
    }


    player.currentTime =
        clamp(
            position,
            0,
            player.duration
        );


    pendingSeek =
        null;


    player
        .play()
        .then(
            () =>
            {
                if (
                    audioUnlocked
                )
                {
                    hideAudioUnlock();
                }
            }
        )
        .catch(
            () =>
            {
                statusEl.textContent =
                    "Clique une fois sur Enable Audio.";

                audioUnlockBox.style.display =
                    "block";
            }
        );
}



player.addEventListener(
    "loadedmetadata",

    () =>
    {
        if (
            pendingSeek !== null
        )
        {
            const target =
                pendingSeek;


            pendingSeek =
                null;


            seekAndPlay(
                target
            );
        }


        if (
            lastData
        )
        {
            updatePassiveDisplay(
                lastData
            );
        }
    }
);



player.addEventListener(
    "ended",

    () =>
    {
        setDisplayState(
            "ENDED"
        );
    }
);



player.addEventListener(
    "play",

    () =>
    {
        if (
            audioUnlocked
        )
        {
            hideAudioUnlock();
        }
    }
);



function switchSession(
    data
)
{
    currentSessionId =
        data.sessionId
        ||
        "";


    const trackUrl =
        data.trackUrl
        ||
        "";


    if (
        !trackUrl
    )
    {
        player.pause();


        player.removeAttribute(
            "src"
        );


        player.load();


        statusEl.textContent =
            "Aucune session musicale active";


        return;
    }


    const position =
        expectedPosition(
            data
        );


    pendingSeek =
        position;


    player.src =
        trackUrl;


    player.load();


    statusEl.textContent =
        "Changement de session...";
}



function applyState(
    data
)
{
    lastData =
        data;


    const volume =
        clamp(
            Number(
                data.volume
            )
            ||
            0,

            0,
            1
        );


    player.volume =
        volume;


    volumeEl.textContent =
        Math.round(
            volume
            *
            100
        );


    distanceEl.textContent =

        Number(
            data.distance
        )
        >=
        0

        ?

        Number(
            data.distance
        ).toFixed(
            2
        )

        :

        "--";


    zoneEl.textContent =
        data.zone
        ||
        "NONE";


    broadcasterEl.textContent =

        data.broadcasterName

        ?

        decodeURIComponent(
            data.broadcasterName
        )

        :

        "NONE";


    trackEl.textContent =

        data.trackTitle

        ?

        decodeURIComponent(
            data.trackTitle
        )

        :

        "NONE";


    const position =
        expectedPosition(
            data
        );


    positionEl.textContent =
        formatTime(
            position
        );


    const sessionId =
        data.sessionId
        ||
        "";


    if (
        sessionId
        &&
        sessionId
        !==
        currentSessionId
    )
    {
        switchSession(
            data
        );
    }

    else if (
        sessionId
        &&
        player.src
        &&
        Date.now()
        -
        lastSyncAt
        >
        2000
    )
    {
        if (
            Number.isFinite(
                player.duration
            )
            &&
            position
            <
            player.duration
        )
        {
            const drift =
                Math.abs(
                    player.currentTime
                    -
                    position
                );


            if (
                drift
                >
                2.0
            )
            {
                player.currentTime =
                    position;
            }
        }


        lastSyncAt =
            Date.now();
    }


    if (
        sessionId
    )
    {
        statusEl.textContent =
            "Receiver connecté — session synchronisée";
    }


    updatePassiveDisplay(
        data
    );


    lastGoodUpdate =
        Date.now();
}



async function refreshState()
{
    if (
        !receiver
    )
    {
        statusEl.textContent =
            "Aucune URL Receiver reçue.";


        player.volume =
            0;


        return;
    }


    const target =
        PROXY
        +
        "/volume?target="
        +
        encodeURIComponent(
            receiver
        );


    try
    {
        const response =
            await fetch(
                target,
                {
                    cache:
                        "no-store"
                }
            );


        if (
            !response.ok
        )
        {
            throw new Error(
                "HTTP "
                +
                response.status
            );
        }


        const text =
            await response.text();


        const data =
            JSON.parse(
                text
            );


        applyState(
            data
        );
    }


    catch (
        error
    )
    {
        statusEl.textContent =
            "Receiver inaccessible";


        if (
            Date.now()
            -
            lastGoodUpdate
            >
            2000
        )
        {
            player.volume =
                0;


            volumeEl.textContent =
                "0";
        }
    }
}



setInterval(
    refreshState,
    500
);


refreshState();

</script>

</body>
</html>
